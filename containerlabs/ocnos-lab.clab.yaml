name: ocnos-lab

mgmt:
  network: ocnos-mgmt
  ipv4-subnet: 172.20.0.0/24

topology:
  nodes:
    r1:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      mgmt-ipv4: 172.20.0.21

    r2:
      kind: ipinfusion_ocnos
      image: vrnetlab/ipinfusion_ocnos:7.0.0-262
      mgmt-ipv4: 172.20.0.22

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]